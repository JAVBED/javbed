name: build-and-release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JAVBED-Windows-x64
          - os: ubuntu-latest
            artifact: JAVBED-Linux-x64
          - os: macos-14
            artifact: JAVBED-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . "pyinstaller>=6,<7"
      - name: Validate Python sources
        run: python -m compileall -q src javbed_main.py
      - name: Build Store helper
        if: runner.os == 'Windows'
        run: dotnet publish store-helper/Javbed.StoreHelper.csproj -c Release -r win-x64 -o store-helper/publish
      - name: Build executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --noconfirm --clean --windowed --name JAVBED --paths src --add-data "src/javbed/assets/artwork:javbed_artwork" --add-binary "store-helper/publish/Javbed.StoreHelper.exe;." javbed_main.py
          else
            pyinstaller --noconfirm --clean --windowed --name JAVBED --paths src --add-data "src/javbed/assets/artwork:javbed_artwork" javbed_main.py
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JAVBED/* -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" JAVBED
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
