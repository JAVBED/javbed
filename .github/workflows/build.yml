name: Build and Release JAVBED

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Leave blank for next patch; or enter 1.2, 1.2.3, or v1.2.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose release tag
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: python tools/release_tag.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JAVBED-Windows-x64
          - os: ubuntu-latest
            artifact: JAVBED-Linux-x64
          - os: macos-14
            artifact: JAVBED-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pyinstaller>=6,<7"

      - name: Embed release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python -c "import os; from pathlib import Path; Path('src/javbed/__init__.py').write_text('__version__ = ' + repr(os.environ['RELEASE_TAG'][1:]) + '\n', encoding='utf-8')"

      - name: Validate Python sources
        run: python -m compileall -q src javbed_main.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build Windows Store helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish .\store-helper\Javbed.StoreHelper.csproj -c Release -r win-x64 -o .\store-helper\publish
          if (!(Test-Path ".\store-helper\publish\Javbed.StoreHelper.exe")) {
            throw "Store helper executable was not produced."
          }

      - name: Build JAVBED
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --noconfirm --clean --windowed --name JAVBED --paths src --add-data "src/javbed/assets/artwork:javbed_artwork" --add-binary "store-helper/publish/Javbed.StoreHelper.exe;." javbed_main.py
          else
            pyinstaller --noconfirm --clean --windowed --name JAVBED --paths src --add-data "src/javbed/assets/artwork:javbed_artwork" javbed_main.py
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JAVBED/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Stage verified Windows engine releases
        if: runner.os == 'Windows'
        run: python tools/installer_payload.py --app-dir dist/JAVBED --output msi-payload

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dotnet tool install --tool-path .\.wix wix --version 5.0.2
          $version = $env:RELEASE_TAG.TrimStart('v')
          $payload = (Resolve-Path .\msi-payload).Path
          .\.wix\wix.exe build -arch x64 -d "Version=$version" -d "Payload=$payload" -o installer.msi .\installer\JAVBED.wxs
          if (!(Test-Path .\installer.msi)) { throw "installer.msi was not produced." }

      - name: Package Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" JAVBED

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            installer.msi
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "JAVBED $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: JAVBED ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
